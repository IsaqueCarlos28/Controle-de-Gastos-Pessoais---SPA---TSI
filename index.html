<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configurações básicas da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Conexão antecipada com servidores de fontes (melhora performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Importação da fonte Roboto Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <!-- Arquivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Título da aba do navegador -->
    <title>Meus Gastos</title>
</head>

<body>

    <!-- Container principal da aplicação -->
    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">
            <h1>Meus gastos</h1>
            <p>Controle suas finanças de forma moderna e eficiente</p>
        </header>

        <!-- Seção de estatísticas -->
        <section class="stats">

            <!-- Saldo atual -->
            <div class="card">
                <span id="balance" class="number">R$ 0,00</span>
                <span class="label">Saldo</span>
            </div>

            <!-- Total de receitas -->
            <div class="card">
                <span id="income-total" class="number blue">R$ 0,00</span>
                <span class="label">Receitas</span>
            </div>

            <!-- Total de despesas -->
            <div class="card">
                <span id="expense-total" class="number pink">R$ 0,00</span>
                <span class="label">Despesas</span>
            </div>

        </section>

        <!-- Formulário de cadastro de novo lançamento -->
        <form class="add-task" id="form-add">

            <!-- Campo de descrição -->
            <input
                type="text"
                id="description"
                placeholder="Descrição do gasto..."
                required
            />

            <!-- Campo de valor -->
            <input
                type="number"
                id="amount"
                class="input-value"
                placeholder="R$ 0,00"
                step="0.01"
                min="0.01"
                required
            />

            <!-- Seleção de tipo: receita ou despesa -->
            <select id="type" class="input-select">
                <option value="income">Receita</option>
                <option value="expense">Despesa</option>
            </select>

            <!-- Seleção de categoria -->
            <select id="category" class="input-select">
                <option value="salario">Salário</option>
                <option value="alimentacao">Alimentação</option>
                <option value="lazer">Lazer</option>
                <option value="transporte">Transporte</option>
                <option value="saude">Saúde</option>
                <option value="outros">Outros</option>
            </select>

            <!-- Botão de adicionar -->
            <button type="submit" id="btn-add" class="btn-add">
                + Adicionar
            </button>

        </form>

        <!-- Filtros de visualização dos lançamentos -->
        <section class="filters">

            <!-- Filtro por tipo -->
            <select id="filter-type" class="filter-select">
                <option value="all">Todos os tipos</option>
                <option value="income">Receitas</option>
                <option value="expense">Despesas</option>
            </select>

            <!-- Filtro por categoria -->
            <select id="filter-category" class="filter-select">
                <option value="all">Todas as categorias</option>
                <option value="salario">Salário</option>
                <option value="alimentacao">Alimentação</option>
                <option value="lazer">Lazer</option>
                <option value="transporte">Transporte</option>
                <option value="saude">Saúde</option>
                <option value="outros">Outros</option>
            </select>

        </section>

        <!-- Lista de lançamentos -->
        <section id="transactions" class="tasks">

            <!-- Os lançamentos serão inseridos aqui dinamicamente via JavaScript -->

        </section>

    </main>

    <!-- Arquivo JavaScript -->
    <script src="script.js"></script>

</body>
</html>
